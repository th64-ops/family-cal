<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家族カレンダー">
<meta name="theme-color" content="#34507a">
<meta name="robots" content="noindex">
<title>家族カレンダー</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#2b3340;--sub:#7b8494;--line:#e6e1d6;--acc:#34507a;--acc2:#e9eef4;--red:#c8414b;--hol:#c8414b;--sat:#3f6e9e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Meiryo","メイリオ","MS Gothic","ＭＳ ゴシック",sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
input,select,textarea{border:1px solid #d6d0c4;border-radius:6px;padding:3px 6px;background:#fff}
textarea{width:100%;line-height:1.6}
header{display:flex;flex-wrap:wrap;gap:2px;align-items:center;background:var(--acc);color:#fff;padding:5px 8px;position:sticky;top:0;z-index:20}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,#34507a 0 33.3%,#fff 33.3% 66.6%,#c8414b 66.6%)}
header .brand{font-weight:bold;margin-right:10px;letter-spacing:.05em}
header a{color:#fff;text-decoration:none;padding:5px 12px;border-radius:16px;letter-spacing:.03em;position:relative}
header a.on{background:var(--bg);color:var(--ink);font-weight:bold}
header a:not(.on):hover{background:rgba(255,255,255,.15)}
header a.gear{font-size:17px;padding:3px 10px}
header .bd{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 3px;font-weight:bold}
header .right{margin-left:auto;font-size:12px;display:flex;gap:6px;align-items:center}
#conn{padding:2px 8px;border-radius:10px;cursor:pointer;white-space:nowrap}
#conn.ng{background:#f3d27a;color:#333}
@media (max-width:640px){header .brand{display:none}header a{padding:5px 8px;font-size:13px}}
main{padding:12px 10px 10px;max-width:1500px;margin:0 auto}
h2{font-size:17px;margin:2px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 見出しの日付（院内ToDo帳と同じ：年は小さく、月を大きく） */
.ym{display:inline-flex;align-items:baseline;gap:1px;white-space:nowrap}
.ym .y{font-size:12px;font-weight:normal;color:var(--sub);margin-right:4px}
.ym .m{font-size:26px;font-weight:bold;line-height:1}
.ym .d{font-size:21px;font-weight:bold;line-height:1;margin-left:1px}
.ym .w{font-size:14px}
.ym .s{font-size:13px;font-weight:normal;margin:0 2px}
.ev .dn2{font-size:11px;color:var(--sub);margin-left:4px}
/* 日付を選ぶ3か月のカレンダー（初診入力と同じ形） */
input[type=date]::-webkit-calendar-picker-indicator{display:none}
input[type=date]{cursor:pointer}
#dp3{position:absolute;z-index:9999;background:#fff;border:1px solid #8aa0b8;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:6px 8px;font-size:13px;user-select:none;-webkit-user-select:none}
#dp3 .dpms{display:flex;gap:4px}
#dp3 .dpm{flex:none;margin:0 4px}
#dp3 .dph{text-align:center;margin:2px 0 4px}
#dp3 .dph b{font-size:20px;color:var(--acc)}
#dp3 .dph small{font-size:10px;color:#999;margin-right:3px}
#dp3 table{border-collapse:collapse}
#dp3 th{font-weight:normal;color:#666;width:28px;font-size:11px}
#dp3 td{width:28px;height:26px;text-align:center;cursor:pointer;border-radius:5px}
#dp3 td:hover{background:#dbe7f5}
#dp3 td.su,#dp3 td.ho{color:var(--hol)}#dp3 td.sa{color:var(--sat)}
#dp3 td.td{outline:1.5px solid var(--acc)}
#dp3 td.sel{background:var(--acc);color:#fff;font-weight:bold}
#dp3 td.e{cursor:default}
#dp3 .dpb{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:2px;flex-wrap:wrap}
#dp3 button{font-size:12px;padding:2px 9px;border:1px solid #8aa0b8;background:#f3f6fa;border-radius:12px;cursor:pointer;color:var(--acc)}
#dp3.sp{left:0!important;right:0;border-radius:0 0 10px 10px;padding:6px 0}
#dp3.sp .dpb{padding:0 8px}
#dp3.sp .dpms{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding:0 4px}
#dp3.sp .dpm{scroll-snap-align:center}
h3{font-size:14px;margin:0 0 6px;color:#3e5672}
.card{background:var(--card);border:1px solid #ebe7de;border-radius:10px;padding:9px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(43,51,64,.05)}
.cols{display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);gap:9px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.lab{font-size:12px;color:var(--sub);min-width:4.2em}
.btn{border:1px solid #d3cec2;background:#fff;border-radius:14px;padding:4px 12px;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold}
.btn.red{color:var(--red);border-color:#e3b8bb}
.btn.sm{padding:1px 8px;font-size:12px}
.note{color:var(--sub);font-size:12px}
.tg{display:inline-block;color:#fff;background:var(--tc);border-radius:9px;padding:0 7px;font-size:11px;line-height:1.6;white-space:nowrap}
/* 人のマーク（○に白抜きのイニシャル） */
.pb{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--pc);color:#fff;font-weight:bold;font-size:.82em;line-height:1;margin-right:1px;vertical-align:middle;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.wb{border:0;background:none;padding:2px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--sub)}
button.wb .pb{width:32px;height:32px;font-size:16px;background:#fff;color:var(--pc);box-shadow:inset 0 0 0 2px var(--pc)}
button.wb.on .pb{background:var(--pc);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--pc)}
button.wb.on{color:var(--ink);font-weight:bold}
.arrow{font-size:20px;color:var(--sub);margin:0 4px}
/* ジャンル・項目のボタン */
.tbtns{display:flex;flex-wrap:wrap;gap:5px}
.tbtns button{border:2px solid var(--tc);background:#fff;color:var(--tc);border-radius:16px;padding:3px 11px;cursor:pointer;font-weight:bold}
.tbtns button.on{background:var(--tc);color:#fff}
.sbtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;min-height:26px}
.sbtns button{border:1px solid var(--tc);background:#fff;border-radius:14px;padding:2px 11px;cursor:pointer}
.sbtns button.on{background:var(--tc);color:#fff}
input.ttl{flex:1;min-width:200px}
.tsel{display:inline-flex;align-items:center;gap:1px}
.tsel select{padding:2px 2px}
label.inl{display:inline-flex;gap:3px;align-items:center;font-size:13px}
.addbar{display:flex;gap:6px;margin:0 0 9px;align-items:center;flex-wrap:wrap}
button.addb{border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:16px;padding:4px 15px;font-weight:bold;cursor:pointer}
button.addb.on{background:var(--acc);color:#fff}
.card.addp{border:2px solid var(--acc)}
details.dc>summary{cursor:pointer;list-style-position:inside}
details.dc>summary h3{display:inline;margin:0}
details.dc[open]>summary{margin-bottom:6px}
/* 予定・ToDo の行 */
.ev{display:flex;gap:7px;align-items:center;padding:5px 6px;border-left:5px solid var(--tc);background:#fff;border-bottom:1px solid #f0ede6;cursor:pointer;flex-wrap:wrap}
.ev:hover{background:#fbfaf6}
.ev .tm{font-family:"MS Gothic","ＭＳ ゴシック",monospace;font-size:13px;min-width:46px;color:#333;line-height:1.2}
.ev .nm{font-weight:bold}
.ev .mm{color:var(--sub);font-size:12px;flex-basis:100%;padding-left:53px;white-space:pre-wrap}
.ev.done{opacity:.5}.ev.done .nm{text-decoration:line-through}
.ev input[type=checkbox]{width:19px;height:19px}
.ic{font-size:11px;color:var(--sub)}
.imp{color:var(--red);font-size:12px}
.sec{font-size:12px;color:var(--sub);margin:8px 0 2px;border-bottom:1px dashed var(--line)}
.empty{color:var(--sub);padding:6px;font-size:13px}
.filt{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.fchip{border:2px solid var(--pc,#8a8f96);color:var(--pc,#555);background:#fff;border-radius:14px;padding:1px 9px;cursor:pointer;font-size:12px;font-weight:bold}
.fchip.on{background:var(--pc,#5b6b7a);color:#fff}
.banner{background:#fff8e6;border:1px solid #f0d58a;border-radius:10px;padding:8px 10px;margin-bottom:9px}
.banner.blue{background:#eef3f9;border-color:#c5d3e6}
/* 週 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.week .wd{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;min-height:260px}
.week .wd.today{outline:2px solid var(--acc)}
.week .wh{font-weight:bold;border-bottom:1px solid var(--line);margin-bottom:3px;font-size:13px;cursor:pointer}
.week .wd.hol .wh{color:var(--hol)}.week .wd.sat .wh{color:var(--sat)}
.week .hn{font-size:10px;font-weight:normal;margin-left:3px}
@media (max-width:760px){.week{grid-template-columns:1fr}.week .wd{min-height:0}}
.it{font-size:12px;border-left:4px solid var(--tc);padding:1px 4px;margin:2px 0;background:var(--tb,#fafaf7);cursor:pointer;line-height:1.45;word-break:break-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.it .t{font-family:"MS Gothic","ＭＳ ゴシック",monospace;margin-right:2px}
.it.td{background:#fff}
.it.td::before{content:"□";margin-right:2px;color:#777}
.it.td.done::before{content:"✓"}
.it.done{opacity:.45;text-decoration:line-through}
.it.msg{background:#fff;border-left:4px double var(--tc);color:#444}
/* 月 */
table.cal{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
table.cal th{background:#ece9e1;font-weight:normal;padding:3px;font-size:12px}
table.cal td{border:1px solid var(--line);vertical-align:top;height:112px;padding:2px 3px;cursor:pointer;background:#fff}
table.cal td:hover{background:#f8f9fa}
table.cal td.oth{background:#f3f1ec;color:#aaa}
table.cal td.today{box-shadow:inset 0 0 0 2px var(--acc)}
table.cal .dn{font-size:12px;font-weight:bold}
table.cal .hol .dn,table.cal th.sun{color:var(--hol)}
table.cal .sat .dn,table.cal th.sat{color:var(--sat)}
table.cal .hn{font-size:10px;color:var(--hol);margin-left:3px}
@media (max-width:640px){table.cal td{height:78px;padding:1px}table.cal .it{font-size:10px;padding:0 2px;border-left-width:3px}table.cal .hn{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ptitle{display:none}
/* 連絡 */
.msg{border-left:6px solid var(--tc);background:#fff;border-radius:8px;padding:7px 10px;margin:6px 0;border:1px solid #ebe7de;border-left:6px solid var(--tc)}
.msg .mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .mh .pb{font-size:15px}
.msg .md{white-space:pre-wrap;margin:5px 0 3px;line-height:1.6}
.msg .due{font-size:13px;color:#333}
.msg .due.over{color:var(--red);font-weight:bold}
.msg.done{opacity:.55}
.msg .mb{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
/* ひとこと */
.talk{max-width:760px;margin:0 auto}
.tday{text-align:center;margin:12px 0 4px}
.tday span{background:#e9e4d8;color:#555;border-radius:10px;padding:1px 10px;font-size:12px}
.tl{display:flex;gap:6px;align-items:flex-end;margin:5px 0}
.tl .pb{font-size:15px;flex:none}
.tl .tb{background:#fff;border:1px solid #e3ded2;border-radius:12px 12px 12px 3px;padding:6px 10px;white-space:pre-wrap;line-height:1.6;max-width:78%;word-break:break-word}
.tl .tt{font-size:11px;color:var(--sub);flex:none}
.tl.me{flex-direction:row-reverse}
.tl.me .tb{background:#dcebd9;border-color:#c6dcc2;border-radius:12px 12px 3px 12px}
.tl .tx{border:0;background:none;color:#b55;cursor:pointer;font-size:12px;padding:0 2px;flex:none}
.tl.new .tb{box-shadow:0 0 0 2px #f0c36b}
.tin{position:sticky;bottom:0;background:var(--bg);padding:8px 0 6px;border-top:1px solid var(--line);margin-top:8px}
.tin .row{align-items:flex-end}
.tin textarea{flex:1;min-height:2.6em}
/* メモ */
.memo{display:grid;grid-template-columns:320px minmax(0,1fr);gap:9px;align-items:start}
@media (max-width:800px){.memo{grid-template-columns:1fr}.memo .mview{display:none}}
.mi{padding:7px 8px;border-bottom:1px solid #eee;cursor:pointer;background:#fff;border-left:4px solid var(--tc,#ccc)}
.mi:hover{background:#fbfaf6}
.mi.on{background:var(--acc2)}
.mi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi>span{font-size:11px;color:var(--sub)}
.mbody{font-size:16px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.mbody a{color:var(--acc)}
.mtitle{font-size:20px;font-weight:bold;margin:2px 0 8px}
textarea.medit{min-height:50vh;font-size:15px}
.bmg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.bmc{background:#fff;border:1px solid #ebe7de;border-top:5px solid var(--tc);border-radius:10px;padding:8px 10px;cursor:pointer}
.bmc .pv{font-size:13px;color:#555;white-space:pre-wrap;max-height:6.5em;overflow:hidden;line-height:1.6}
.star{color:#d19a2e}
/* モーダル・トースト */
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(30,35,45,.38);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-top:4vh}
.modal .box{background:#fff;border-radius:12px;padding:12px 14px;width:min(860px,96vw);max-height:92vh;overflow:auto}
.modal.full .box{width:98vw;max-height:96vh;min-height:90vh}
.modal.full{padding-top:1vh}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#333;color:#fff;padding:7px 16px;border-radius:16px;font-size:13px;z-index:60;display:none;max-width:90vw}
footer{color:var(--sub);font-size:11px;padding:6px 10px;text-align:center}
.qr img{image-rendering:pixelated;border:1px solid #ddd;border-radius:6px}
.kv{display:grid;grid-template-columns:9em minmax(0,1fr);gap:6px;align-items:center}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.mono{font-family:"MS Gothic","ＭＳ ゴシック",monospace}
/* 印刷（Monthly・A4横） */
@page{size:A4 landscape;margin:7mm}
@media print{
  header,footer,.noprint,#toast,.modal{display:none!important}
  html,body{background:#fff}
  main{padding:0;max-width:none}
  .ptitle{display:flex;justify-content:space-between;align-items:baseline;font-size:20pt;font-weight:bold;margin:0 0 2mm}
  .ptitle small{font-size:9pt;font-weight:normal;color:#555}
  table.cal{page-break-inside:auto}
  table.cal tr{break-inside:avoid;page-break-inside:avoid}
  table.cal th{font-size:10pt;padding:1mm;background:#ece9e1!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.cal td,table.cal td:hover{height:var(--ph,28mm);padding:.6mm 1mm;box-shadow:none!important;background:#fff}
  table.cal td.oth{background:#f6f5f2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.cal .dn{font-size:12pt}
  table.cal .hn{font-size:8pt}
  table.cal .it{white-space:normal;overflow:visible;margin:.4mm 0;line-height:1.3;font-weight:bold}
  body.pf-l table.cal .it{font-size:11pt}
  body.pf-m table.cal .it{font-size:9.5pt}
  body.pf-s table.cal .it{font-size:8pt}
  .it .pb{font-size:.8em}
}
</style>
</head>
<body class="pf-m">
<header>
  <span class="brand">家族カレンダー</span>
  <a href="#daily" data-v="daily">Daily</a>
  <a href="#week" data-v="week">Weekly</a>
  <a href="#month" data-v="month">Monthly</a>
  <a href="#msg" data-v="msg">連絡事項<span class="bd" id="bdMsg" hidden></span></a>
  <a href="#talk" data-v="talk">ひとこと<span class="bd" id="bdTalk" hidden></span></a>
  <a href="#memo" data-v="memo">Memo</a>
  <a href="#bm" data-v="bm">Bookmark</a>
  <a href="#set" data-v="set" class="gear" title="設定">⚙</a>
  <span class="right"><span id="conn"></span></span>
</header>
<main id="main"><p>読み込み中…</p></main>
<footer><span id="ver"></span></footer>
<div id="modal" class="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toast"></div>

/* ================= 祝日（法律の規則からの計算） ================= */
var HOL = {};
function holidays(y) {
  if (HOL[y]) return HOL[y];
  var h = {};
  function add(m, d, n) { h[y + '-' + pad(m) + '-' + pad(d)] = n; }
  function nthMon(m, n) { var d = new Date(y, m - 1, 1); return 1 + (8 - d.getDay()) % 7 + (n - 1) * 7; }
  var k = y - 1980, q = Math.floor(k / 4);
  add(1, 1, '元日'); add(1, nthMon(1, 2), '成人の日'); add(2, 11, '建国記念の日'); add(2, 23, '天皇誕生日');
  add(3, Math.floor(20.8431 + 0.242194 * k - q), '春分の日'); add(4, 29, '昭和の日');
  add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  add(7, nthMon(7, 3), '海の日'); add(8, 11, '山の日'); add(9, nthMon(9, 3), '敬老の日');
  add(9, Math.floor(23.2488 + 0.242194 * k - q), '秋分の日'); add(10, nthMon(10, 2), 'スポーツの日');
  add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  var base = Object.keys(h);
  base.forEach(function (s) { var n1 = addDays(s, 1), n2 = addDays(s, 2); if (!h[n1] && h[n2] && pd(n1).getDay() !== 0) h[n1] = '国民の休日'; });
  base.forEach(function (s) { if (pd(s).getDay() === 0) { var n = addDays(s, 1); while (h[n]) n = addDays(n, 1); h[n] = '振替休日'; } });
  HOL[y] = h; return h;
}

    '<div class="row"><span class="lab">人</span><div id="xw">' + whoBtns(who) + '</div><span class="note">選んだ人が入っている予定を書き出す（F〔家族〕の予定も出すときは F も選ぶ）</span></div>' +
    '<div class="row"><label class="inl"><input type="checkbox" id="xg" checked>Googleから取り込んだ予定は書き出さない（Google 側で二重にならないように）</label></div>' +
    '<div class="row"><label class="inl"><input type="checkbox" id="xs" checked>［Google へ］で1件ずつ送った予定は書き出さない</label></div>' +
    '<div class="row"><button class="btn pri" id="xgo">書き出す</button><button class="btn" data-close>閉じる</button><span class="note" id="xmsg"></span></div>' +

    '<li>初回だけ：Googleカレンダー →（右上の歯車）設定 → 左の「カレンダーを追加」→「新しいカレンダーを作成」→ 名前「家族カレンダー」→ 作成</li>' +
    '<li>設定 →「インポート／エクスポート」→「パソコンからファイルを選択」で書き出した .ics → 「カレンダーに追加」で <b>家族カレンダー</b> を選ぶ →「インポート」</li>' +
    '<li>書き出し直すとき：重ならないように、設定で「家族カレンダー」を削除 → 作り直してから読み込む（ほかのカレンダーに入れないこと）</li></ol></div>');
  $$('#xw button.wb').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-p'), i = who.indexOf(k); if (i >= 0) who.splice(i, 1); else who.push(k); b.classList.toggle('on'); }; });
  $('#xgo').onclick = function () {
    var A = $('#xA').value, B = $('#xB').value; S.xA = A; S.xB = B;
    if (!A || !B || A > B) { alert('期間を確かめてください'); return; }
    if (diffDays(A, B) > 1100) { alert('期間は3年以内にしてください'); return; }
    if (!who.length) { alert('人を選んでください'); return; }
    var r = buildICS(A, B, who, $('#xg').checked, $('#xs').checked);
    if (!r.n) { $('#xmsg').textContent = 'この条件の予定はありません'; return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([r.text], { type: 'text/calendar;charset=utf-8' }));
    a.download = '家族カレンダー_' + icsD(A) + '-' + icsD(B) + '.ics'; document.body.appendChild(a); a.click(); a.remove();
    $('#xmsg').textContent = r.n + ' 件を書き出しました（ダウンロードのフォルダ）';
  };
}

/* ================= 日付を選ぶ3か月のカレンダー（初診入力 datepick.js と同じ形。月を大きく、年は小さく） =================
   日付の欄を押すと 前の月・その月・次の月 を出す。真ん中の月を入力欄の真ん中の下に。はみ出すときは画面の端に合わせる。
   スマホ（幅 640px 以下）では画面の幅いっぱいに出し、横にずらせる（真ん中の月を見える位置に）。祝日は赤 */
(function () {
  var box = null, cur = null, base = null;
  function close() { if (box) { box.remove(); box = null; cur = null; } }
  function month(y, m, sel, td) {
    var f = new Date(y, m, 1), h = '<div class="dpm"><div class="dph"><small>' + y + '年</small><b>' + (m + 1) + '月</b></div><table><tr>' + '日月火水木金土'.split('').map(function (w) { return '<th>' + w + '</th>'; }).join('') + '</tr><tr>';
    for (var i = 0; i < f.getDay(); i++) h += '<td class="e"></td>';
    var n = new Date(y, m + 1, 0).getDate();
    for (var d = 1; d <= n; d++) {
      var s = y + '-' + pad(m + 1) + '-' + pad(d), w = (f.getDay() + d - 1) % 7, hn = holName(s);
      h += '<td data-v="' + s + '"' + (hn ? ' title="' + hn + '"' : '') + ' class="' + (w === 0 ? 'su ' : w === 6 ? 'sa ' : '') + (hn ? 'ho ' : '') + (s === sel ? 'sel ' : '') + (s === td ? 'td' : '') + '">' + d + '</td>';
      if (w === 6 && d < n) h += '</tr><tr>';
    }
    return h + '</tr></table></div>';
  }
  function draw() {
    var sel = cur.value, td = today(), y = base.getFullYear(), m = base.getMonth();
    var h = '<div class="dpb"><button data-n="-1">◀ 前の月</button><span><button data-t="1">今日</button> ' + (cur.required ? '' : '<button data-c="1">消す</button> ') + '<button data-x="1">閉じる</button></span><button data-n="1">次の月 ▶</button></div><div class="dpms">';
    for (var k = -1; k <= 1; k++) { var d = new Date(y, m + k, 1); h += month(d.getFullYear(), d.getMonth(), sel, td); }
    box.innerHTML = h + '</div>';
    if (box.classList.contains('sp')) { var ms = box.querySelector('.dpms'), mid = ms.children[1]; ms.scrollLeft = mid.offsetLeft - (ms.clientWidth - mid.offsetWidth) / 2; }
  }
  function set(v) {
    var el = cur; close(); el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function open(el) {
    if (el.disabled || el.readOnly) return;
    close(); cur = el;
    var v = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : today();
    base = new Date(+v.slice(0, 4), +v.slice(5, 7) - 1, 1);
    box = document.createElement('div'); box.id = 'dp3';
    var vw = document.documentElement.clientWidth, sp = vw <= 640; if (sp) box.classList.add('sp');
    document.body.appendChild(box); draw();
    var r = el.getBoundingClientRect(), yy = r.bottom + window.scrollY + 2, x;
    if (sp) x = window.scrollX;
    else {
      x = r.left + r.width / 2 + window.scrollX - box.offsetWidth / 2;
      if (x + box.offsetWidth > window.scrollX + vw - 4) x = window.scrollX + vw - box.offsetWidth - 4;
      if (x < window.scrollX + 4) x = window.scrollX + 4;
    }
    if (r.bottom + box.offsetHeight > window.innerHeight && r.top > box.offsetHeight) yy = r.top + window.scrollY - box.offsetHeight - 2;
    box.style.left = x + 'px'; box.style.top = yy + 'px'; if (sp) box.style.width = vw + 'px';
    function hit(e) {
      var t = e.target, tdv = t.closest && t.closest('td[data-v]');
      if (tdv) { e.preventDefault(); return set(tdv.getAttribute('data-v')); }
      if (t.getAttribute('data-n')) { e.preventDefault(); base = new Date(base.getFullYear(), base.getMonth() + (+t.getAttribute('data-n')), 1); draw(); return; }
      if (t.getAttribute('data-t')) { e.preventDefault(); return set(today()); }
      if (t.getAttribute('data-c')) { e.preventDefault(); return set(''); }
      if (t.getAttribute('data-x')) { e.preventDefault(); return close(); }
    }
    box.addEventListener('mousedown', function (e) { if (!(e.target.closest && e.target.closest('.dpms') && sp)) e.preventDefault(); });
    box.addEventListener('click', hit);
  }
  function isDate(t) { return t && t.tagName === 'INPUT' && t.type === 'date'; }
  document.addEventListener('mousedown', function (e) {
    var t = e.target; if (box && box.contains(t)) return;
    if (isDate(t)) { e.preventDefault(); if (cur !== t) setTimeout(function () { open(t); }, 0); else close(); return; }
    close();
  }, true);
  /* スマホ・タブレット：標準の日付の画面を出さずにこのカレンダーを出す */
  document.addEventListener('touchstart', function (e) {
    var t = e.target; if (box && box.contains(t)) return;
    if (isDate(t)) { e.preventDefault(); if (cur !== t) open(t); else close(); return; }
    close();
  }, { capture: true, passive: false });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); if (box && cur && e.target === cur && (e.key === 'Tab' || e.key === 'Enter')) close(); }, true);
  window.addEventListener('hashchange', close);
  window.addEventListener('resize', function () { if (!('ontouchstart' in window)) close(); });
})();
